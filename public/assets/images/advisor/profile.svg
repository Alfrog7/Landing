<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 380" role="img" aria-label="Fotografía profesional de Melanie Silva, corredora de seguros">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10B981"/>
      <stop offset="0.55" stop-color="#0F766E"/>
      <stop offset="1" stop-color="#0B132B"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".4" r=".55">
      <stop offset="0" stop-color="#ECFDF5" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ECFDF5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6D5BF"/><stop offset="1" stop-color="#E9B896"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B2A2A"/><stop offset="1" stop-color="#1B1414"/>
    </linearGradient>
    <linearGradient id="blazer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E293B"/><stop offset="1" stop-color="#0B132B"/>
    </linearGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#fff" fill-opacity=".2"/></pattern>
    <linearGradient id="fadeV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient>
    <mask id="m"><rect width="320" height="380" fill="url(#fadeV)"/></mask>
    <clipPath id="card"><rect width="320" height="380" rx="24"/></clipPath>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>
  <g clip-path="url(#card)">
    <rect width="320" height="380" fill="url(#bg)"/>
    <rect width="320" height="380" fill="url(#dots)" mask="url(#m)"/>
    <circle cx="160" cy="150" r="170" fill="url(#halo)"/>
    <circle cx="268" cy="64" r="46" fill="#FBBF24" fill-opacity=".18"/>
    <circle cx="40" cy="300" r="70" fill="#34D399" fill-opacity=".16"/>
    <g fill="none" stroke="#fff" stroke-opacity=".14"><circle cx="160" cy="170" r="104"/><circle cx="160" cy="170" r="146" stroke-dasharray="3 8"/></g>

    <!-- cabello (parte trasera) -->
    <path d="M96 150c-6-62 30-96 66-96s72 34 66 96c-2 34 6 56 14 76-26 6-46-8-56-30H138c-10 22-30 36-56 30 8-20 16-42 14-76z" fill="url(#hair)"/>
    <!-- cuello y torso -->
    <g filter="url(#sh)">
      <path d="M50 380c0-62 44-104 110-104s110 42 110 104z" fill="url(#blazer)"/>
      <path d="M138 270h44v42c0 14-10 24-22 24s-22-10-22-24z" fill="url(#skin)"/>
      <path d="M138 276c8 14 36 14 44 0v-12h-44z" fill="#000" fill-opacity=".1"/>
      <!-- blusa y solapas -->
      <path d="M160 302l-34-26-24 20 38 84h40l38-84-24-20z" fill="#F8FAFC"/>
      <path d="M160 318l-34-42-24 20 30 56 28-34z" fill="#1E293B"/>
      <path d="M160 318l34-42 24 20-30 56-28-34z" fill="#1E293B"/>
      <path d="M160 322l-14 18 14 40 14-40z" fill="#ECFDF5"/>
    </g>
    <!-- rostro -->
    <ellipse cx="160" cy="168" rx="50" ry="58" fill="url(#skin)"/>
    <!-- flequillo -->
    <path d="M108 160c4-46 30-66 60-62 28 4 46 26 44 62-14-24-30-38-56-40-22 0-38 16-48 40z" fill="url(#hair)"/>
    <path d="M118 126c18-14 46-16 70-4" stroke="#fff" stroke-opacity=".18" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- rasgos suaves -->
    <path d="M136 172q8-6 16 0M168 172q8-6 16 0" stroke="#2B1B17" stroke-width="3.2" stroke-linecap="round" fill="none"/>
    <path d="M132 160q10-6 20-2M168 158q10-4 20 2" stroke="#3B2A2A" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M160 176v16" stroke="#C99679" stroke-width="3" stroke-linecap="round"/>
    <path d="M146 204q14 12 28 0" stroke="#B4546B" stroke-width="4" stroke-linecap="round" fill="none"/>
    <ellipse cx="132" cy="190" rx="9" ry="6" fill="#F4A6A0" fill-opacity=".35"/><ellipse cx="188" cy="190" rx="9" ry="6" fill="#F4A6A0" fill-opacity=".35"/>
    <!-- credencial -->
    <g filter="url(#sh)"><rect x="196" y="296" width="52" height="64" rx="8" fill="#fff"/><rect x="196" y="296" width="52" height="16" rx="8" fill="#10B981"/><circle cx="222" cy="330" r="9" fill="#CBD5E1"/><rect x="206" y="346" width="32" height="5" rx="2.5" fill="#94A3B8"/></g>
    <path d="M222 296v-18" stroke="#10B981" stroke-width="3"/>
  </g>
</svg>
