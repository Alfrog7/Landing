<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#1E293B"/><stop offset="1" stop-color="#0A0F1F"/>
    </linearGradient>
    <radialGradient id="glowA"><stop offset="0" stop-color="#FBBF24" stop-opacity=".5"/><stop offset="1" stop-color="#FBBF24" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB"><stop offset="0" stop-color="#38BDF8" stop-opacity=".38"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#fff" fill-opacity=".18"/></pattern>
    <radialGradient id="fade" cx=".5" cy=".4" r=".62"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
    <mask id="dotmask"><rect width="640" height="640" fill="url(#fade)"/></mask>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".34"/><stop offset="1" stop-color="#fff" stop-opacity=".09"/></linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#DDE6EF"/></linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBBF24"/><stop offset="1" stop-color="#F59E0B"/></linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FDE68A"/><stop offset="1" stop-color="#F59E0B"/></linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".45"/></linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="175%"><feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000" flood-opacity=".42"/></filter>
    <filter id="sh2" x="-30%" y="-30%" width="160%" height="175%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000" flood-opacity=".35"/></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>
  <rect width="640" height="640" fill="url(#bg)"/>
  <circle cx="480" cy="140" r="250" fill="url(#glowA)"/>
  <circle cx="120" cy="540" r="260" fill="url(#glowB)"/>
  <rect width="640" height="640" fill="url(#dots)" mask="url(#dotmask)"/>
  <g fill="none" stroke="#fff" stroke-opacity=".09">
    <circle cx="320" cy="268" r="150"/><circle cx="320" cy="268" r="215" stroke-dasharray="3 9"/><circle cx="320" cy="268" r="290"/>
  </g>
  <g stroke="#fff" stroke-opacity=".5" stroke-width="2" stroke-linecap="round">
    <path d="M118 150h14M125 143v14"/><path d="M520 300h12M526 294v12"/><path d="M540 120h10M545 115v10"/><path d="M96 330h10M101 325v10"/>
  </g>
  <g fill="#fff" fill-opacity=".55"><circle cx="500" cy="210" r="2.4"/><circle cx="140" cy="250" r="2"/><circle cx="560" cy="380" r="2.2"/><circle cx="90" cy="430" r="1.8"/></g>
  <g transform="translate(0 -30) translate(320 285) scale(.88) translate(-320 -285)">
  <!-- montañas -->
  <path d="M0 430 L120 300 L210 380 L320 250 L430 370 L520 300 L640 420 V640 H0Z" fill="#334155" fill-opacity=".55"/>
  <path d="M0 470 L100 380 L190 440 L300 330 L420 450 L520 390 L640 470 V640 H0Z" fill="#475569" fill-opacity=".45"/>
  <path d="M300 330 l-26 36 l22-10 l10 18 l12-20 l16 14Z" fill="#fff" fill-opacity=".25"/>
  <!-- haz de luz -->
  <path d="M290 262 L120 420 L400 440 Z" fill="#FDE68A" fill-opacity=".14"/>
  <!-- casco -->
  <g filter="url(#sh)">
    <path d="M205 300a115 115 0 0 1 230 0Z" fill="url(#warm)"/>
    <path d="M205 300a115 115 0 0 1 60-100l-6 100Z" fill="#fff" fill-opacity=".22"/>
    <rect x="288" y="168" width="64" height="132" rx="20" fill="#FDE68A" fill-opacity=".85"/><rect x="304" y="168" width="32" height="132" rx="10" fill="#F59E0B" fill-opacity=".55"/>
    <rect x="178" y="296" width="284" height="40" rx="20" fill="#F59E0B"/><rect x="178" y="296" width="284" height="14" rx="7" fill="#fff" fill-opacity=".28"/>
    <circle cx="320" cy="220" r="22" fill="#fff"/><circle cx="320" cy="220" r="14" fill="#FEF3C7"/><circle cx="320" cy="220" r="7" fill="#FBBF24"/>
  </g>
  <!-- carnet -->
  <g filter="url(#sh)" transform="rotate(7 440 360)">
    <rect x="368" y="318" width="150" height="104" rx="14" fill="url(#paper)"/>
    <circle cx="398" cy="348" r="16" fill="url(#acc)"/><rect x="424" y="338" width="70" height="8" rx="4" fill="#94A3B8"/><rect x="424" y="354" width="48" height="8" rx="4" fill="#CBD5E1"/>
    <g fill="#0F172A"><rect x="382" y="380" width="4" height="28"/><rect x="390" y="380" width="2" height="28"/><rect x="396" y="380" width="6" height="28"/><rect x="406" y="380" width="2" height="28"/><rect x="412" y="380" width="4" height="28"/><rect x="420" y="380" width="7" height="28"/><rect x="431" y="380" width="2" height="28"/><rect x="437" y="380" width="4" height="28"/><rect x="445" y="380" width="6" height="28"/><rect x="455" y="380" width="2" height="28"/><rect x="461" y="380" width="4" height="28"/><rect x="469" y="380" width="7" height="28"/><rect x="480" y="380" width="3" height="28"/></g>
  </g>
  <!-- reloj -->
  <g filter="url(#sh2)"><circle cx="182" cy="250" r="44" fill="url(#glass)" stroke="#fff" stroke-opacity=".4"/><circle cx="182" cy="250" r="32" fill="#fff"/>
    <path d="M182 230v20l15 9" fill="none" stroke="#059669" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g filter="url(#sh2)"><rect x="150" y="306" width="64" height="32" rx="16" fill="url(#glass)" stroke="#fff" stroke-opacity=".38" /><text x="182" y="327" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="13.44" fill="#FDE68A">&lt;2h</text></g></g>
  <rect y="400" width="640" height="240" fill="url(#ground)"/>
</svg>
