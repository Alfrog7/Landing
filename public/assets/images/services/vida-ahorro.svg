  <g transform="translate(0 -30) translate(320 285) scale(.88) translate(-320 -285)">
  <g filter="url(#sh)">
    <path d="M320 105.4 L455 159.4 V272.8 C455 353.8 395.6 397 320 429.4 C244.39999999999998 397 185 353.8 185 272.8 V159.4 Z" fill="url(#glass)" stroke="#fff" stroke-opacity=".5" stroke-width="3"/>
    <path d="M320 188c-24-44-92-26-92 26 0 46 56 80 92 108 36-28 92-62 92-108 0-52-68-70-92-26z" fill="#FB7185"/>
    <path d="M320 188c-24-44-92-26-92 26 0 20 8 36 20 50 10-48 44-66 72-76z" fill="#fff" fill-opacity=".28"/>
    <path d="M320 188c24-44 92-26 92 26 0 46-56 80-92 108z" fill="#E11D48" fill-opacity=".35"/>
  </g>
  <!-- brote y monedas -->
  <g filter="url(#sh2)">
    <ellipse cx="210" cy="411" rx="32" ry="13.44" fill="#B45309"/><ellipse cx="210" cy="404" rx="32" ry="13.44" fill="url(#warm)"/><ellipse cx="210" cy="404" rx="19.84" ry="7.68" fill="none" stroke="#B45309" stroke-opacity=".5" stroke-width="2"/><ellipse cx="210" cy="393" rx="32" ry="13.44" fill="#B45309"/><ellipse cx="210" cy="386" rx="32" ry="13.44" fill="url(#warm)"/><ellipse cx="210" cy="386" rx="19.84" ry="7.68" fill="none" stroke="#B45309" stroke-opacity=".5" stroke-width="2"/><ellipse cx="210" cy="375" rx="32" ry="13.44" fill="#B45309"/><ellipse cx="210" cy="368" rx="32" ry="13.44" fill="url(#warm)"/><ellipse cx="210" cy="368" rx="19.84" ry="7.68" fill="none" stroke="#B45309" stroke-opacity=".5" stroke-width="2"/>
    <path d="M210 352V316" stroke="#4ADE80" stroke-width="5" stroke-linecap="round"/>
    <path d="M210 330c-26-2-34-20-30-34 22-2 36 10 30 34z" fill="#4ADE80"/><path d="M210 322c24 0 34-16 32-30-22 0-34 10-32 30z" fill="#22C55E"/>
  </g>
