  <g fill="none" stroke="#FDE68A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M426 372a52 52 0 1 0-20 40"/><path d="M432 340l-6 34 -32-8"/></g>
  <g filter="url(#sh2)"><rect x="398" y="188" width="100" height="40" rx="20" fill="url(#glass)" stroke="#fff" stroke-opacity=".38" /><text x="448" y="214" text-anchor="middle" font-family="Arial" font-weight="800" font-size="16" fill="#FDE68A">+ 100 %</text></g></g>
  <rect y="400" width="640" height="240" fill="url(#ground)"/>
</svg>
