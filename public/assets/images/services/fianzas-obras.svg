    <rect x="215" y="228" width="148" height="9" rx="4.5" fill="#94A3B8" fill-opacity=".85"/><rect x="215" y="250" width="148" height="9" rx="4.5" fill="#94A3B8" fill-opacity=".85"/><rect x="215" y="272" width="148" height="9" rx="4.5" fill="#94A3B8" fill-opacity=".85"/><rect x="215" y="294" width="91.76" height="9" rx="4.5" fill="#94A3B8" fill-opacity=".85"/>
