    <path d="M300 395l-12 38 24-12 12 28 8-44z" fill="#059669"/>
    <rect x="215" y="352" width="76" height="26" rx="8" fill="#0F172A"/><text x="253" y="370" text-anchor="middle" font-family="Arial" font-weight="700" font-size="14" fill="#34D399">OSCE</text>
