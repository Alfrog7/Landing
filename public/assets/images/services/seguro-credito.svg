  <g filter="url(#sh)" transform="rotate(-9 230 280)">
    <rect x="150" y="190" width="150" height="198" rx="14" fill="url(#paper)"/>
    <rect x="168" y="208" width="52" height="10" rx="5" fill="#2563EB"/><rect x="168" y="236" width="112" height="9" rx="4.5" fill="#94A3B8" fill-opacity=".85"/><rect x="168" y="255" width="112" height="9" rx="4.5" fill="#94A3B8" fill-opacity=".85"/><rect x="168" y="274" width="112" height="9" rx="4.5" fill="#94A3B8" fill-opacity=".85"/><rect x="168" y="293" width="112" height="9" rx="4.5" fill="#94A3B8" fill-opacity=".85"/><rect x="168" y="312" width="69.44" height="9" rx="4.5" fill="#94A3B8" fill-opacity=".85"/>
    <text x="168" y="360" font-family="Arial" font-weight="800" font-size="20" fill="#0F172A">S/ 9,900</text>
  </g>
  <!-- escudo principal -->
  <g filter="url(#sh)">
    <path d="M335 123 L460 173 V278 C460 353 405 393 335 423 C265 393 210 353 210 278 V173 Z" fill="url(#acc)" />
    <path d="M335 140 L400 166 V236 C400 296 372 330 335 358 Z" fill="#fff" fill-opacity=".14"/>
    <path d="M335 123 L460 173 V278 C460 353 405 393 335 423 C265 393 210 353 210 278 V173 Z" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="3"/>
    <path d="M291 277.76 l28.16 29.92 l59.84 -65.12" fill="none" stroke="#fff" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- gráfico ascendente -->
  <g filter="url(#sh2)"><rect x="398" y="270" width="112" height="94" rx="16" fill="url(#glass)" stroke="#fff" stroke-opacity=".38" />
    <rect x="414" y="322" width="16" height="28" rx="4" fill="#fff" fill-opacity=".7"/><rect x="438" y="304" width="16" height="46" rx="4" fill="#fff" fill-opacity=".8"/><rect x="462" y="286" width="16" height="64" rx="4" fill="#34D399"/>
    <path d="M412 308 L440 290 L462 272 L484 280" fill="none" stroke="#FDE68A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g filter="url(#sh2)"><rect x="396" y="168" width="98" height="38" rx="19" fill="url(#glass)" stroke="#fff" stroke-opacity=".38" /><text x="445" y="192" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="15.959999999999999" fill="#7DD3FC">90 %</text></g>
  <ellipse cx="184" cy="417" rx="30" ry="12.6" fill="#B45309"/><ellipse cx="184" cy="410" rx="30" ry="12.6" fill="url(#warm)"/><ellipse cx="184" cy="410" rx="18.6" ry="7.199999999999999" fill="none" stroke="#B45309" stroke-opacity=".5" stroke-width="2"/><ellipse cx="184" cy="399" rx="30" ry="12.6" fill="#B45309"/><ellipse cx="184" cy="392" rx="30" ry="12.6" fill="url(#warm)"/><ellipse cx="184" cy="392" rx="18.6" ry="7.199999999999999" fill="none" stroke="#B45309" stroke-opacity=".5" stroke-width="2"/><ellipse cx="184" cy="381" rx="30" ry="12.6" fill="#B45309"/><ellipse cx="184" cy="374" rx="30" ry="12.6" fill="url(#warm)"/><ellipse cx="184" cy="374" rx="18.6" ry="7.199999999999999" fill="none" stroke="#B45309" stroke-opacity=".5" stroke-width="2"/></g>
  <rect y="400" width="640" height="240" fill="url(#ground)"/>
