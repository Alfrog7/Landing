<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#1E3A8A"/><stop offset="1" stop-color="#0A1030"/>
    </linearGradient>
    <radialGradient id="glowA"><stop offset="0" stop-color="#38BDF8" stop-opacity=".5"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB"><stop offset="0" stop-color="#818CF8" stop-opacity=".38"/><stop offset="1" stop-color="#818CF8" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#fff" fill-opacity=".18"/></pattern>
    <radialGradient id="fade" cx=".5" cy=".4" r=".62"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
    <mask id="dotmask"><rect width="640" height="640" fill="url(#fade)"/></mask>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".34"/><stop offset="1" stop-color="#fff" stop-opacity=".09"/></linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#DDE6EF"/></linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38BDF8"/><stop offset="1" stop-color="#2563EB"/></linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FDE68A"/><stop offset="1" stop-color="#F59E0B"/></linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".45"/></linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="175%"><feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000" flood-opacity=".42"/></filter>
    <filter id="sh2" x="-30%" y="-30%" width="160%" height="175%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000" flood-opacity=".35"/></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>
  <rect width="640" height="640" fill="url(#bg)"/>
  <circle cx="480" cy="140" r="250" fill="url(#glowA)"/>
  <circle cx="120" cy="540" r="260" fill="url(#glowB)"/>
  <rect width="640" height="640" fill="url(#dots)" mask="url(#dotmask)"/>
  <g fill="none" stroke="#fff" stroke-opacity=".09">
    <circle cx="320" cy="268" r="150"/><circle cx="320" cy="268" r="215" stroke-dasharray="3 9"/><circle cx="320" cy="268" r="290"/>
  </g>
  <g stroke="#fff" stroke-opacity=".5" stroke-width="2" stroke-linecap="round">
    <path d="M118 150h14M125 143v14"/><path d="M520 300h12M526 294v12"/><path d="M540 120h10M545 115v10"/><path d="M96 330h10M101 325v10"/>
