<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#0C4A6E"/><stop offset="1" stop-color="#06142A"/>
    </linearGradient>
    <radialGradient id="glowA"><stop offset="0" stop-color="#38BDF8" stop-opacity=".5"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB"><stop offset="0" stop-color="#FB923C" stop-opacity=".38"/><stop offset="1" stop-color="#FB923C" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#fff" fill-opacity=".18"/></pattern>
    <radialGradient id="fade" cx=".5" cy=".4" r=".62"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
    <mask id="dotmask"><rect width="640" height="640" fill="url(#fade)"/></mask>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".34"/><stop offset="1" stop-color="#fff" stop-opacity=".09"/></linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#DDE6EF"/></linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38BDF8"/><stop offset="1" stop-color="#0EA5E9"/></linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FDE68A"/><stop offset="1" stop-color="#F59E0B"/></linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".45"/></linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="175%"><feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000" flood-opacity=".42"/></filter>
    <filter id="sh2" x="-30%" y="-30%" width="160%" height="175%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000" flood-opacity=".35"/></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>
  <rect width="640" height="640" fill="url(#bg)"/>
  <circle cx="480" cy="140" r="250" fill="url(#glowA)"/>
  <circle cx="120" cy="540" r="260" fill="url(#glowB)"/>
  <rect width="640" height="640" fill="url(#dots)" mask="url(#dotmask)"/>
  <g fill="none" stroke="#fff" stroke-opacity=".09">
    <circle cx="320" cy="268" r="150"/><circle cx="320" cy="268" r="215" stroke-dasharray="3 9"/><circle cx="320" cy="268" r="290"/>
  </g>
  <g stroke="#fff" stroke-opacity=".5" stroke-width="2" stroke-linecap="round">
    <path d="M118 150h14M125 143v14"/><path d="M520 300h12M526 294v12"/><path d="M540 120h10M545 115v10"/><path d="M96 330h10M101 325v10"/>
  </g>
  <g fill="#fff" fill-opacity=".55"><circle cx="500" cy="210" r="2.4"/><circle cx="140" cy="250" r="2"/><circle cx="560" cy="380" r="2.2"/><circle cx="90" cy="430" r="1.8"/></g>
  <g transform="translate(0 -30) translate(320 285) scale(.88) translate(-320 -285)">
  <!-- grúa -->
  <g stroke="#FB923C" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M212 420V140"/><path d="M200 140h250"/><path d="M212 140l-30 16M440 140v34"/>
    <path d="M212 175l60-35M212 215l120-75"/>
  </g>
  <rect x="190" y="132" width="44" height="18" rx="4" fill="#FB923C"/>
  <path d="M376 140v66" stroke="#E2E8F0" stroke-width="3"/><rect x="346" y="206" width="60" height="14" rx="3" fill="url(#warm)"/>
  <g stroke="#E2E8F0" stroke-width="2.5"><path d="M358 206l18-14 18 14"/></g>
  <!-- edificio en construcción -->
  <g filter="url(#sh)">
    <rect x="232" y="300" width="214" height="120" rx="10" fill="url(#glass)" stroke="#fff" stroke-opacity=".4"/>
    <rect x="248" y="248" width="182" height="60" rx="8" fill="none" stroke="#7DD3FC" stroke-opacity=".7" stroke-width="2.5" stroke-dasharray="7 6"/>
    <rect x="262" y="212" width="154" height="40" rx="8" fill="none" stroke="#7DD3FC" stroke-opacity=".45" stroke-width="2.5" stroke-dasharray="7 6"/>
    <g fill="#7DD3FC" fill-opacity=".85"><rect x="250" y="320" width="34" height="28" rx="5"/><rect x="298" y="320" width="34" height="28" rx="5"/><rect x="346" y="320" width="34" height="28" rx="5"/><rect x="394" y="320" width="34" height="28" rx="5"/></g>
    <g fill="#FDE68A" fill-opacity=".9"><rect x="298" y="366" width="34" height="28" rx="5"/><rect x="394" y="366" width="34" height="28" rx="5"/></g>
    <rect x="250" y="366" width="34" height="54" rx="5" fill="#fff" fill-opacity=".7"/>
    <g stroke="#fff" stroke-opacity=".4" stroke-width="2"><path d="M232 300h214M246 252h186M262 212v40M416 212v40"/></g>
  </g>
  <!-- plano -->
  <g filter="url(#sh2)" transform="rotate(-6 150 360)"><rect x="110" y="316" width="120" height="86" rx="10" fill="#1D4ED8"/><g stroke="#fff" stroke-opacity=".7" stroke-width="2" fill="none"><path d="M124 340h92M124 358h60M124 376h78"/><circle cx="200" cy="364" r="12"/></g></g>
  <g filter="url(#sh2)"><rect x="404" y="346" width="74" height="34" rx="17" fill="url(#glass)" stroke="#fff" stroke-opacity=".38" /><text x="441" y="368" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="14.28" fill="#7DD3FC">CAR</text></g></g>
  <rect y="400" width="640" height="240" fill="url(#ground)"/>
</svg>
